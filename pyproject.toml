[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teltonika-modbus-configurator"
version = "0.6.0.dev0"
description = "Generate, validate and deploy Teltonika RutOS Modbus configurations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "paramiko>=3.4",
    "xlrd>=2.0.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tmc = "teltonika_modbus_configurator.cli:main"
tmc-gui = "teltonika_modbus_configurator.gui_v06:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
